<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        .icon { 
            display: inline-block;
            background: linear-gradient(135deg, #9933ff, #6500c2);
            border-radius: 20%;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 1;
            margin: 10px;
        }
        .icon16 { width: 16px; height: 16px; font-size: 10px; padding: 3px 0; }
        .icon48 { width: 48px; height: 48px; font-size: 24px; padding: 12px 0; }
        .icon128 { width: 128px; height: 128px; font-size: 64px; padding: 32px 0; }
    </style>
</head>
<body>
    <h3>아이콘 생성 가이드</h3>
    <p>각 아이콘을 우클릭하여 "다른 이름으로 이미지 저장"으로 저장하세요:</p>
    
    <div style="background: white; padding: 10px; display: inline-block;">
        <div class="icon icon16">CR</div>
        <span>← icon16.png로 저장</span>
    </div><br>
    
    <div style="background: white; padding: 10px; display: inline-block;">
        <div class="icon icon48">CR</div>
        <span>← icon48.png로 저장</span>
    </div><br>
    
    <div style="background: white; padding: 10px; display: inline-block;">
        <div class="icon icon128">CR</div>
        <span>← icon128.png로 저장</span>
    </div>
    
    <h4>또는 온라인 도구 사용:</h4>
    <ol>
        <li><a href="https://favicon.io/favicon-generator/">favicon.io</a>에서 "CR" 텍스트로 생성</li>
        <li>배경색: #9933ff</li>
        <li>텍스트색: white</li>
        <li>16x16, 48x48, 128x128 크기로 다운로드</li>
    </ol>
</body>
</html>
